<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="sign-in-page">
<div class="login-container">
        <img src="pics/InfiniteLoopBlue.png" alt="Logo" class="corner-image">
</div>

    <div class="login-card">
        <div class="input-group">
            <label>Email @dome.tu.ac.th</label>
            <input type="email" id="loginEmail" placeholder="example@dome.tu.ac.th">
        </div>
            <div class="input-group">
            <label>Password</label>
            <div class="password-wrapper">
              <input type="password" id="loginPassword" placeholder="password">
              <i class="fa-solid fa-eye" id="togglePassword"></i>
            </div>
          </div>
            <button type="button" id="signInBtn" class="sign-in-btn">Sign In</button>
          </div>
      </div>

<div id="toast"></div>
</body>
<script src="script.js"></script>
</html>
